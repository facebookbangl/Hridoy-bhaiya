  <body class="bg-[#0a060d] text-white selection:bg-[#ff2a85] selection:text-white min-h-screen">
    <!-- GPU-composited isolated background layer -->
    <div id="zp-ambient-bg" aria-hidden="true"></div>

    <div id="root">
      <!-- Lightweight Horror-Themed Instant Preloader (replaced automatically on React mount) -->
      <div id="zp-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a060d; color: #ffffff; font-family: 'Hind Siliguri', sans-serif; gap: 16px; padding: 24px;">
        <div style="position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border: 3px solid rgba(255, 42, 133, 0.2); border-top-color: #ff2a85; border-radius: 50%; animation: zpSpin 0.9s linear infinite;"></div>
          <div style="font-size: 22px; animation: zpPulse 1.4s ease-in-out infinite;">🔥</div>
        </div>
        <div style="text-align: center;">
          <div style="font-weight: 800; font-size: 18px; letter-spacing: 2px; color: #ffffff;">
            ZERO POINT <span style="color: #ff2a85; text-shadow: 0 0 14px rgba(255,42,133,0.8);">FF</span>
          </div>
          <div style="font-size: 12px; color: #d8b4d8; margin-top: 6px; letter-spacing: 0.5px;">লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন</div>
          <button id="zp-force-reload-btn" onclick="window.zpClearAndReload()" style="display: none; margin-top: 14px; padding: 7px 18px; border-radius: 10px; background: #ff2a85; color: #ffffff; font-size: 13px; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 0 16px rgba(255,42,133,0.5); font-family: inherit;">
            দেরি হচ্ছে? রিফ্রেশ করুন
          </button>
        </div>
        <style>
          @keyframes zpSpin { to { transform: rotate(360deg); } }
          @keyframes zpPulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.18); opacity: 1; } }
        </style>
      </div>
    </div>
    <script>
      window.zpClearAndReload = function() {
        try {
          localStorage.removeItem('zp_settings');
          localStorage.removeItem('zp_accounts');
          localStorage.removeItem('zp_reviews');
          localStorage.removeItem('zp_orders');
          sessionStorage.clear();
        } catch(e) {}
        window.location.reload();
      };
      // Watchdog timer: If app hasn't mounted in 2.5s, reveal reload action
      setTimeout(function() {
        var btn = document.getElementById('zp-force-reload-btn');
        if (btn && document.getElementById('zp-initial-loader')) {
          btn.style.display = 'inline-block';
        }
      }, 2500);
      window.addEventListener('error', function() {
        var btn = document.getElementById('zp-force-reload-btn');
        if (btn) btn.style.display = 'inline-block';
      });
    </script>
